services:
  database:
    container_name: ps-database
    build:
      context: ./backend/database
    environment:
      DOCKER_DB_PASSWORD: ${DOCKER_DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$DB_USERNAME -p$DB_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks:
      - db_net

  backend:
    container_name: ps-backend
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      args:
        ADMIN_NODE_VERSION: ${ADMIN_NODE_VERSION:-14}
        REACT_APP_HOST_API_PORT: ${REACT_APP_HOST_API_PORT:-8080}
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: database
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      SERVER_MODE: ${SERVER_MODE}
      SERVER_PORT: ${SERVER_PORT}
      SERVER_SOCKET_PATH: ${SERVER_SOCKET_PATH:-}
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "${DOCKER_APP_PORT:-8080}:${DOCKER_APP_PORT:-8080}"
    restart: unless-stopped
    networks:
      - app_net
      - db_net

  frontend:
    container_name: ps-frontend
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:${DOCKER_APP_PORT:-8080}
      API_BASE_URL: http://backend:${DOCKER_APP_PORT:-8080}
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5100:3000"
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    restart: unless-stopped
    networks:
      - app_net


volumes:
  db_data:
  frontend_node_modules:
  react_admin_node_modules:

networks:
  app_net:
  db_net:
    internal: true
